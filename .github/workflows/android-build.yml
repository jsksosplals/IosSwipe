name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          set +e
          gradle assembleDebug --no-daemon --continue 2>&1 | tee build.log
          echo "GRADLE_EXIT=$?"

      - name: Print errors
        if: always()
        run: |
          echo "::group::KOTLIN ERRORS"
          grep -E "^e: file:" build.log || echo "(no kotlin errors)"
          echo "::endgroup::"
          echo "::group::FAILED TASKS"
          grep -E "FAILED|What went wrong|Caused by" build.log || echo "(no failed tasks)"
          echo "::endgroup::"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
